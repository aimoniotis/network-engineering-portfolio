# ==============================================================================
# Nginx Configuration for Nextcloud (Tailscale Network)
# ==============================================================================
 

# PATH = /etc/nginx/sites-available/nextcloud


# ------------------------------------------------------------------------------
# HTTP Block: Automatically Redirect Unencrypted Traffic to HTTPS
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name xxxx.tailxxxx.ts.net xxxx;

    # Returns a 301 Permanent Redirect to ensure all HTTP traffic is upgraded to HTTPS
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------------------------
# HTTPS Block: Secure Nextcloud Server Instance
# ------------------------------------------------------------------------------
server {
    # Listen on Port 443 with SSL enabled and HTTP/2 support for enhanced performance
    listen 443 ssl http2;
    server_name xxxx.tailxxxx.ts.net;

    # Document Root and Index configuration
    root /var/www/nextcloud;
    index index.php index.html;

    # TLS/SSL Certificate paths (Tailscale HTTPS certificates)
    ssl_certificate /etc/nginx/ssl/xxxx.ts.net.crt;
    ssl_certificate_key /etc/nginx/ssl/xxxx.ts.net.key;

    # Security Hardening: Enforce HSTS for 180 days (15,552,000 seconds) including subdomains
    add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

    # File Uploads: Allows uploading large files up to 4GB without Nginx throwing "413 Payload Too Large"
    client_max_body_size 4G;

    # Main Routing: Directs traffic to requested files, directories, or passes back to index.php
    location / {
        try_files $uri $uri/ /index.php$request_uri;
    }

    # PHP Execution: Handled via FastCGI to PHP 8.3-FPM process manager socket
    location ~ \.php(?:$|/) {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        
        # FastCGI Unix Socket for PHP 8.3
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        
        # Passes correct client connection IP data to PHP application layer
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param REMOTE_ADDR $remote_addr;
    }

    # Security: Deny access to hidden Apache configuration files (.htaccess, .htpasswd, etc.)
    location ~ /\.ht {
        deny all;
    }

    # Nextcloud Client Service Discovery: Redirects CardDAV requests to the native DAV endpoint
    location = /.well-known/carddav {
        return 301 /remote.php/dav;
    }

    # Nextcloud Client Service Discovery: Redirects CalDAV requests to the native DAV endpoint
    location = /.well-known/caldav {
        return 301 /remote.php/dav;
    }
}