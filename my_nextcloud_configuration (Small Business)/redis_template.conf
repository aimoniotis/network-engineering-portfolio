# ==============================================================================
# REDIS CONFIGURATION
# ==============================================================================

# PATH= /etc/redis/redis.conf

# ------------------------------------------------------------------------------
# 1. NETWORK & SOCKETS
# ------------------------------------------------------------------------------
# Bind interface for fallback (disabled TCP port renders this inactive)
bind 127.0.0.1 -::1

# Safeguard against unauthorized external network access
protected-mode yes

# Disable standard TCP port (0 disables listening on network ports entirely)
port 0

# TCP backlog setting (retained for engine defaults)
tcp-backlog 511

# Enable Unix Domain Socket for faster local inter-process communication
unixsocket /run/redis/redis-server.sock

# Permissions for the Unix socket (770 = owner/group full access)
unixsocketperm 770

# Close connection after N seconds of client idleness (0 = disabled)
timeout 0

# Send TCP keepalive probes every 300 seconds
tcp-keepalive 300


# ------------------------------------------------------------------------------
# 2. GENERAL & PROCESS MANAGEMENT
# ------------------------------------------------------------------------------
# Run Redis as a system daemon in the background
daemonize yes

# Integrate process lifecycle management with systemd
supervised systemd

# Location of the process ID file
pidfile /run/redis/redis-server.pid

# Logging verbosity level (options: debug, verbose, notice, warning)
loglevel notice

# Log file destination path
logfile /var/log/redis/redis-server.log

# Number of available logical databases (0 to 15)
databases 16

# Suppress the ASCII art logo in startup logs
always-show-logo no

# Set system process title
set-proc-title yes
proc-title-template "{title} {listen-addr} {server-mode}"


# ------------------------------------------------------------------------------
# 3. SNAPSHOTTING & PERSISTENCE
# ------------------------------------------------------------------------------
# Stop accepting write commands if background RDB snapshot creation fails
stop-writes-on-bgsave-error yes

# Compress string objects using LZF when dumping .rdb databases
rdbcompression yes

# Place a CRC64 checksum at the end of the RDB file for data integrity
rdbchecksum yes

# File name for the DB snapshot
dbfilename dump.rdb

# Do not delete temporary replication files immediately if sync fails
rdb-del-sync-files no

# Working directory for database dumps and state files
dir /var/lib/redis


# ------------------------------------------------------------------------------
# 4. REPLICATION / CLUSTERING DEFAULTS
# ------------------------------------------------------------------------------
# Allow stale data responses from replica during broken sync connections
replica-serve-stale-data yes

# Enforce read-only state on replica nodes
replica-read-only yes

# Enable diskless synchronization (stream RDB directly over sockets)
repl-diskless-sync yes

# Delay in seconds before starting diskless replication transfer
repl-diskless-sync-delay 5

# Maximum number of replicas allowed for diskless sync
repl-diskless-sync-max-replicas 0

# Disable diskless loading during initial state load
repl-diskless-load disabled

# Disable TCP_NODELAY on replica socket after sync
repl-disable-tcp-nodelay no

# Replication priority for failover elections
replica-priority 100