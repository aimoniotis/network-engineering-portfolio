; ==============================================================================
; PHP 8.3 FPM Configuration for Nextcloud (`/etc/php/8.3/fpm/php.ini`)
; ==============================================================================
 
[PHP]

; ------------------------------------------------------------------------------
; Language & Core Execution Options
; ------------------------------------------------------------------------------

; Disables short opening tags (<? ... ?>) to prevent conflicts with XML templates
short_open_tag = Off

; Enables internal PHP execution engine
engine = On

; Sets floating point precision to 14 digits
precision = 14

; Enables standard internal output buffering (4KB chunk size)
output_buffering = 4096

; Disables transparent zlib compression at the output buffer layer
zlib.output_compression = Off

; Disables implicit flushing of output buffers to maximize script performance
implicit_flush = Off

; Sets serialize precision to match safe cross-platform floating-point serialization
serialize_precision = -1

; Disables arbitrary function execution mapping
disable_functions = 

; Disables arbitrary class execution mapping
disable_classes =

; Enables circular memory reference collection
zend.enable_gc = On

; Automatically omits local arguments from stack traces for security hardening
zend.exception_ignore_args = On

; Reduces stack trace string parameter length to zero in production
zend.exception_string_param_max_len = 0


; ------------------------------------------------------------------------------
; Miscellaneous Settings
; ------------------------------------------------------------------------------

; Hides PHP version headers from HTTP server responses for security hardening
expose_php = Off


; ------------------------------------------------------------------------------
; Resource Limits (Optimized for Nextcloud File Sync & Heavy Processing)
; ------------------------------------------------------------------------------

; Maximum execution time per script (set to 360s to prevent long background/sync timeouts)
max_execution_time = 360

; Maximum time spent parsing incoming request data (POST/FileUploads)
max_input_time = 360

; Maximum memory allocation limit per PHP process script (512MB required for Nextcloud apps & previews)
memory_limit = 512M


; ------------------------------------------------------------------------------
; Error Handling and Logging (Production-Hardened Profile)
; ------------------------------------------------------------------------------

; Error reporting level: Reports all errors excluding minor notices and strict coding deprecations
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Disables printing errors directly to the browser/stdout output stream
display_errors = Off

; Disables printing startup sequence errors to browser output
display_startup_errors = Off

; Enables centralized system error logging for background troubleshooting
log_errors = On

; Disables ignoring repeated identical errors in the same source line
ignore_repeated_errors = Off

; Disables ignoring source paths when tracking repeated logs
ignore_repeated_source = Off

; Enables memory leak detection reports in debug logs
report_memleaks = On


; ------------------------------------------------------------------------------
; Data Handling & Superglobals
; ------------------------------------------------------------------------------

; Determines registered superglobals order (Excludes ENV to reduce performance overhead)
variables_order = "GPCS"

; Determines order of variables populated into the $_REQUEST superglobal array
request_order = "GP"

; Disables automatic registration of $argv and $argc command-line variables for web SAPI
register_argc_argv = Off

; Delays creation of ENV, REQUEST, and SERVER variables until first use (Just-In-Time)
auto_globals_jit = On

; Maximum size of HTTP POST data accepted by PHP (Set to 4G to match Nginx client max body size)
post_max_size = 4G

; Defines default media type format for HTTP output headers
default_mimetype = "text/html"

; Sets default character encoding standard to UTF-8
default_charset = "UTF-8"


; ------------------------------------------------------------------------------
; Paths and Directories
; ------------------------------------------------------------------------------

; Disables dynamic extension loading via script runtime (dl() function)
enable_dl = Off